name: Feature request
description: Suggest an improvement to the Android companion.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task are you trying to complete?
      description: Describe what you do today and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would make this work better for you?
      description: Describe the result you want. Mention desktop Hub behavior if it affects the request.
    validations:
      required: true
