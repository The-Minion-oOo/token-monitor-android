name: Released Hub contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require reviewed main
        run: test "$GITHUB_REF" = "refs/heads/main"
      # This code is executed only after review/merge or explicit dispatch on main.
      # Keep the literal pin in agreement with upstream.json; never execute a PR-selected ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Javis603/token-monitor
          ref: 126e9a43dcc51d3d7b2609231eac9974ba73bed7
          path: upstream-contract-source
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Exercise the released Hub with isolated synthetic data
        run: >-
          node tools/check-hub-contract.mjs --upstream-repo upstream-contract-source
          --approved-commit 126e9a43dcc51d3d7b2609231eac9974ba73bed7
      - name: Parse actual Hub responses in Android's compatibility tests
        env:
          TOKEN_MONITOR_CONTRACT_DIR: ${{ github.workspace }}/app/build/hub-contract
        run: ./gradlew :app:testDebugUnitTest --rerun-tasks --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: released-hub-contract
          path: |
            app/build/hub-contract/
            app/build/reports/tests/
          retention-days: 14
