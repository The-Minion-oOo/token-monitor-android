name: Android interaction checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interaction:
    name: interaction-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            sdk: '36'
          - api: 37
            sdk: '37.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Use command-line tools that understand Android 17
        if: matrix.api == 37
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;23.0'
          mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/cmdline-tools-preinstalled"
          ln -s 23.0 "$ANDROID_HOME/cmdline-tools/latest"
      - name: Free disk space for the AVD
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise synthetic dashboard and lifecycle flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          pre-emulator-launch-script: grep -Fx 'target=android-${{ matrix.sdk }}' "$ANDROID_AVD_HOME/test.ini"
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PtokenMonitorPreview=true --no-daemon --console=plain
            node tools/check-instrumentation.mjs app/build/outputs/androidTest-results/connected/debug 105
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-interaction-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
  optimized:
    name: optimized-api26
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Create a disposable CI signing key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android
          -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 2
          -dname 'CN=Disposable emulator test'
      - name: Build the optimized APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/smoke.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: smoke
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch optimized app on oldest supported Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: node tools/emulator-smoke.mjs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-optimized-api26-results
          path: build/emulator-smoke/
          retention-days: 14
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/smoke.jks"
