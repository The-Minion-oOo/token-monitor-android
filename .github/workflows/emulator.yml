name: Android interaction checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction:
    name: interaction-api${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            sdk: '36'
            tests: ''
          - api: 37
            sdk: '37.0'
            tests: '-Pandroid.testInstrumentationRunnerArguments.class=io.github.theminionooo.tokenmonitor.ConnectionLifecycleTest,io.github.theminionooo.tokenmonitor.HomeAddressRepairTest,io.github.theminionooo.tokenmonitor.DashboardInteractionTest,io.github.theminionooo.tokenmonitor.PresentationInteractionTest,io.github.theminionooo.tokenmonitor.WidgetControlsTest'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Free disk space for the AVD
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise synthetic dashboard and lifecycle flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: ./gradlew :app:connectedDebugAndroidTest -PtokenMonitorPreview=true ${{ matrix.tests }} --no-daemon --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-interaction-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
  optimized:
    name: optimized-api26
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Create a disposable CI signing key
        run: >-
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android
          -keypass android -alias smoke -keyalg RSA -keysize 2048 -validity 2
          -dname 'CN=Disposable emulator test'
      - name: Build the optimized APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/smoke.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: smoke
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Launch optimized app on oldest supported Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 4096M
          script: node tools/emulator-smoke.mjs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-optimized-api26-results
          path: build/emulator-smoke/
          retention-days: 14
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/smoke.jks"
