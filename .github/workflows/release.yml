name: Android release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the reviewed main branch
        run: test "${{ github.ref }}" = "refs/heads/main"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/token-monitor-release.jks"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/token-monitor-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - name: Prepare release files
        id: metadata
        shell: pwsh
        run: |
          $properties = Get-Content gradle.properties | ConvertFrom-StringData
          $version = $properties.tokenMonitorVersionName.TrimStart('v')
          $revision = [int]$properties.tokenMonitorVersionCode % 1000
          $tag = "android-v$version-r$revision"
          $apk = "token-monitor-android-v$version-r$revision.apk"
          Copy-Item app/build/outputs/apk/release/app-release.apk $apk
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $apk" | Set-Content -NoNewline "$apk.sha256"
          [ordered]@{
            schemaVersion = 1
            packageName = 'io.github.theminionooo.tokenmonitor'
            tag = $tag
            versionName = $properties.tokenMonitorVersionName
            versionCode = [int]$properties.tokenMonitorVersionCode
            apk = $apk
            sizeBytes = (Get-Item $apk).Length
            sha256 = $hash
          } | ConvertTo-Json -Compress | Set-Content -NoNewline 'token-monitor-android-update.json'
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path $notes)) { throw "Missing curated release notes: $notes" }
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "apk=$apk" >> $env:GITHUB_OUTPUT
          "title=Android v$version r$revision" >> $env:GITHUB_OUTPUT
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          verify --verbose "${{ steps.metadata.outputs.apk }}"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.metadata.outputs.tag }}"
          "${{ steps.metadata.outputs.apk }}"
          "${{ steps.metadata.outputs.apk }}.sha256"
          token-monitor-android-update.json
          --target "${{ github.sha }}"
          --title "${{ steps.metadata.outputs.title }}"
          --notes-file "${{ steps.metadata.outputs.notes }}"
          --draft
