name: Android release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the reviewed main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Require passing checks on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-preflight.mjs
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/token-monitor-release.jks"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/token-monitor-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - name: Verify production identity and prepare matching release assets
        id: metadata
        run: node tools/check-release.mjs --apk app/build/outputs/apk/release/app-release.apk --prepare build/release
      - name: Recheck main and its checks before creating the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-preflight.mjs
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_APK: ${{ steps.metadata.outputs.apk }}
          RELEASE_MANIFEST: ${{ steps.metadata.outputs.manifest }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: >-
          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256"
          "$RELEASE_MANIFEST" --target "$GITHUB_SHA" --title "$RELEASE_TITLE"
          --notes-file "$RELEASE_NOTES" --draft
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/token-monitor-release.jks"
